name: CI

# Backstop for the pre-push hook. The hook can be skipped (--no-verify) or
# simply never enabled on a given clone, so the same rule is enforced again
# here, where it cannot be bypassed silently.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the version check needs history, not just the tip

      - uses: actions/setup-node@v5
        with:
          node-version: '20'   # matches the Node on the shop RPis

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Version bumped for shipped changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          else
            base="${{ github.event.before }}"
          fi
          bash scripts/check-version-bump.sh "$base" HEAD
